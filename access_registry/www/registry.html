<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>Реестр доступа</title>
	<link rel="icon" href="/assets/access_registry/images/registry-logo.svg" type="image/svg+xml">
	<style>{{ colocated_css | safe }}</style>
</head>
<body>
	{% if allowed %}
	<div id="app" data-desk="{{ 1 if desk else 0 }}" data-admin="{{ 1 if admin else 0 }}">
		<div class="boot"><div class="spinner"></div></div>
	</div>
	<script>window.frappe = window.frappe || {};</script>
	<!-- csrf_token -->
	<script>{{ colocated_js | safe }}</script>
	{% else %}
	<main class="denied">
		<h1>Нет доступа к реестру</h1>
		<p>Попросите администратора реестра выдать вам профиль доступа к приложению или одну из ролей
		реестра.</p>
		<p>{% if admin %}<a href="/app">Перейти в админку</a> · {% endif %}<a href="/?cmd=web_logout">Выйти</a></p>
	</main>
	{% endif %}
</body>
</html>
