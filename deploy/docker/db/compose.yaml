# MariaDB for the registry on the database server (Frappe v15 needs MariaDB, not MySQL).
#   cp db.env.example db.env && docker compose --env-file db.env up -d
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-buffer-pool-size=${INNODB_BUFFER_POOL_SIZE:-2G}
      - --max-allowed-packet=256M
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in db.env}
      MARIADB_AUTO_UPGRADE: 1
    ports:
      # published only on the address the application server reaches (set it explicitly: not 0.0.0.0)
      - ${DB_BIND_ADDRESS:?set DB_BIND_ADDRESS in db.env — the address of this server in the network of the application server}:${DB_PUBLISH_PORT:-3306}:3306
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
