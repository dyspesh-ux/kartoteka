[project]
name = "access_registry"
authors = [
    { name = "Access Registry contributors" }
]
description = "Реестр «кто есть кто и у кого какой доступ»: зеркало кадровых данных 1С:ЗУП во Frappe"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # frappe and requests are provided by the bench environment
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501", "B017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
